<label class="muted">
  Bed:
  <select [value]="currentAddress()" (change)="onSelect($any($event.target).value)">
    @if (options().length === 0) {
      <option value="">Scanning for beds...</option>
    }
    @for (d of options(); track d.address) {
      <option [value]="d.address">{{ d.name }} ({{ d.address }})</option>
    }
  </select>
</label>
