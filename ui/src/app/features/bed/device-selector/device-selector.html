<label class="muted">
  Bed:
  <select [value]="currentId()" (change)="onSelect($any($event.target).value)">
    @if (options().length === 0) {
      <option value="">Scanning for beds...</option>
    } @else if (!currentId()) {
      <option value="">Pick a bed...</option>
    }
    @for (d of options(); track d.id) {
      <option [value]="d.id">{{ d.name }} ({{ d.address }})</option>
    }
  </select>
</label>
