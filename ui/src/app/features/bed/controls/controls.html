<section class="panel">
  <h2>Controls</h2>

  <div class="segmented" role="group" aria-label="Mode">
    @for (m of modes; track m.value) {
      <button type="button" [attr.aria-pressed]="mode() === m.value" (click)="selectMode(m.value)">
        {{ m.label }}
      </button>
    }
  </div>

  @switch (mode()) {
    @case ('manual') {
      @for (zone of zones(); track $index) {
        <div class="slider-row">
          <label [for]="'zone-' + $index">Zone {{ $index + 1 }}</label>
          <input
            type="range"
            [id]="'zone-' + $index"
            [min]="store.airLimits().min"
            [max]="store.airLimits().max"
            [value]="zone"
            (input)="setZone($index, $any($event.target).value)"
          />
          <span>{{ zone }}</span>
        </div>
      }
    }
    @case ('pressure') {
      <div class="slider-row">
        <label for="firmness">Firmness</label>
        <input
          type="range"
          id="firmness"
          [min]="store.airLimits().min"
          [max]="store.airLimits().max"
          [value]="firmness()"
          (input)="setFirmness($any($event.target).value)"
        />
        <span>{{ firmness() }}</span>
      </div>
    }
    @case ('position') {
      <div class="row muted">Adjusts to your sleep position.</div>
    }
  }

  <div class="row">
    <button type="button" class="danger stop" (click)="stop()">Stop</button>
  </div>

  <div class="muted" role="status" [style.color]="statusColor()">{{ status() }}</div>
</section>
