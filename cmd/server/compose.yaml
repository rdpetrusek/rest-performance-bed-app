# The API service. Included from the root compose.yaml.
services:
  api:
    build:
      context: ../..
      dockerfile: cmd/server/Dockerfile
    environment:
      # Extra /24 prefixes to scan for beds, comma-separated (e.g. "192.168.1").
      # There is no bed address to configure: beds are found by scanning, and
      # the one the user picks is remembered by id. The container can't see the
      # host's LAN interfaces on Docker Desktop, so tell discovery which LAN to sweep.
      - SCAN_SUBNETS=${SCAN_SUBNETS:-}
    volumes:
      - restbed_data:/data
    restart: unless-stopped

volumes:
  restbed_data:
